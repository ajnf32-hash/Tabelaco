<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabelaço — como fica no celular</title>
<!-- Página só de conferência: mostra o app dentro de uma tela de celular, para
     dar para ver a versão de celular sem sair do computador. Não faz parte do
     app; dá para apagar este arquivo a qualquer momento sem quebrar nada. -->
<style>
  :root{--fundo:#0a0b0a;--txt:#e2e3e0;--mut:#8f9c8b;--linha:rgba(255,255,255,.12);--ouro:#D9A93C}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--fundo);color:var(--txt);
       font-family:'Archivo Narrow',system-ui,Segoe UI,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px 40px}
  h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.5px;color:var(--ouro)}
  .dica{margin:0;font-size:14px;color:var(--mut);text-align:center;max-width:560px;line-height:1.5}
  .botoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .botoes button{background:#1a1c1b;color:var(--mut);border:1px solid var(--linha);
       border-radius:6px;padding:9px 15px;font-family:inherit;font-size:14px;font-weight:600;
       cursor:pointer}
  .botoes button:hover{color:var(--txt)}
  .botoes button.on{background:var(--ouro);color:#15161A;border-color:var(--ouro)}

  /* o "aparelho": moldura preta com o app dentro, do tamanho de um celular */
  .aparelho{position:relative;background:#000;border-radius:38px;padding:12px;
       box-shadow:0 30px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08)}
  .aparelho::after{content:'';position:absolute;left:50%;transform:translateX(-50%);
       top:20px;width:96px;height:20px;background:#000;border-radius:12px;
       pointer-events:none;z-index:2}
  iframe{display:block;border:none;border-radius:28px;background:#121413;
       width:390px;height:844px;transition:width .25s, height .25s}
  .medida{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <h1>TABELAÇO — VERSÃO DE CELULAR</h1>
  <p class="dica">É exatamente o que aparece no celular, do tamanho certo.
     Dá para clicar, deslizar de lado e escolher o time aqui dentro.</p>

  <div class="botoes" id="botoes"></div>

  <div class="aparelho">
    <iframe id="tela" src="index.html" title="Tabelaço no celular"></iframe>
  </div>

  <div class="medida" id="medida"></div>

<script>
  /* três aparelhos comuns, do menor ao maior — o menor é o que mais aperta o
     desenho, então é o que vale a pena olhar com atenção */
  const APARELHOS = [
    { nome: 'iPhone SE',    l: 375, a: 667 },
    { nome: 'Celular comum', l: 390, a: 844 },
    { nome: 'Celular grande', l: 430, a: 932 }
  ];
  let escolhido = 1;

  const tela = document.getElementById('tela');
  const medida = document.getElementById('medida');
  const botoes = document.getElementById('botoes');

  function aplicar() {
    const a = APARELHOS[escolhido];
    tela.style.width = a.l + 'px';
    tela.style.height = a.a + 'px';
    medida.textContent = a.nome + ' — ' + a.l + ' × ' + a.a + ' pontos';
    [...botoes.children].forEach((b, i) => b.classList.toggle('on', i === escolhido));
  }

  APARELHOS.forEach((a, i) => {
    const b = document.createElement('button');
    b.textContent = a.nome;
    b.onclick = () => { escolhido = i; aplicar(); };
    botoes.appendChild(b);
  });
  aplicar();
</script>
</body>
</html>
